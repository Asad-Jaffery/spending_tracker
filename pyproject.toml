[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "spend-tracker"
version = "0.2.0"
description = "Local transaction imports, merchant classification, and spending summaries"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
spend-tracker = "spend_tracker.__main__:main"

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
